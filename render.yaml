databases:
  - name: wra-database
    plan: free
    region: singapore

services:
  - type: web
    name: wra-web
    runtime: node
    region: singapore
    plan: free
    rootDir: web
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wra-database
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: IMAGE_SERVER_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
